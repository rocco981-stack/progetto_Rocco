[package]
name = "becity"
version = "3.3.0"
edition = "2021"
description = "BeCity – avvio locale della piattaforma (server statico, conversione DWG, PostGIS)"
license = "LicenseRef-BeCity"

[[bin]]
name = "BeCity"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
acadrust = { version = "0.6.8", default-features = false }
postgres = "0.19"
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
panic = "unwind"
